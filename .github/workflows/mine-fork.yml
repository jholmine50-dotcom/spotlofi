name: ListenUp Mine fork (Mac + mod)

on:
  push:
    branches: [main]
    paths: ["mine-fork/app/**", "mine-fork/mod/**", "mine-fork/version.json", ".github/workflows/mine-fork.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mine-fork
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Usar o Xcode mais novo (com Apple Intelligence)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$X" ]; then sudo xcode-select -s "$X"; fi
          xcodebuild -version
      - name: Compilar o app (Apple Silicon + Intel)
        working-directory: mine-fork/app
        run: |
          set -e
          BUILD_ONLY=1 ARCH=arm64 bash build-app.sh
          mv build/ListenUp.app /tmp/arm.app
          BUILD_ONLY=1 ARCH=x86_64 bash build-app.sh
          lipo -create /tmp/arm.app/Contents/MacOS/ListenUp build/ListenUp.app/Contents/MacOS/ListenUp -output /tmp/ListenUp-uni
          cp /tmp/ListenUp-uni build/ListenUp.app/Contents/MacOS/ListenUp
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'ListenUp Mine fork'" build/ListenUp.app/Contents/Info.plist
          codesign --force --deep --sign - build/ListenUp.app
          lipo -info build/ListenUp.app/Contents/MacOS/ListenUp
          mkdir -p ../../out
          ditto -c -k --keepParent build/ListenUp.app ../../out/ListenUp-Mine-fork-Mac.zip
      - name: Publicar na página de download e avisar os apps do fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V=$(jq -r .version mine-fork/version.json)
          MOD=$(jq -r .mod mine-fork/version.json)
          cp out/ListenUp-Mine-fork-Mac.zip "out/ListenUp-Mine-fork-Mac-v$V.zip"
          cp "mine-fork/mod/$MOD" "out/$MOD"
          gh release view mine-fork >/dev/null 2>&1 || gh release create mine-fork --title "ListenUp Mine fork + mod ListenUp Show" --notes "Versão separada do ListenUp com cara de Minecraft e o mod ListenUp Show (Fabric 1.21.1)."
          gh release upload mine-fork "out/ListenUp-Mine-fork-Mac-v$V.zip" out/ListenUp-Mine-fork-Mac.zip "out/$MOD" --clobber
          # tira da página os arquivos de versões antigas (mod e app)
          gh release view mine-fork --json assets --jq '.assets[].name' | while read -r A; do
            case "$A" in
              "ListenUp-Mine-fork-Mac.zip"|"ListenUp-Mine-fork-Mac-v$V.zip"|"$MOD") ;;
              ListenUpShow-*|ListenUp-Mine-fork-Mac-v*) gh release delete-asset mine-fork "$A" -y ;;
            esac
          done
          jq --arg zip "https://github.com/${{ github.repository }}/releases/download/mine-fork/ListenUp-Mine-fork-Mac-v$V.zip" \
             '{version, zip: $zip, notes, mod, intro}' mine-fork/version.json > mine-fork/latest.json
          cat mine-fork/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mine-fork/latest.json
          git commit -m "Mine fork $V publicado" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
